[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heian-city-optimizer"
version = "0.1.0"
authors = [{name = "Heian City Optimizer Contributors"}]
description = "A lightweight heuristic optimizer for small city planning scenarios inspired by Heian-era Kyoto."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
heian-city-optimizer = "heian_city_optimizer.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

